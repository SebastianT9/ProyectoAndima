<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andima | Tienda Virtual</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 

    <style>
        /* --- ESTILOS DE LA TIENDA --- */
        body {
            display: block !important;
            height: auto !important;
            overflow-y: auto !important;
            padding: 20px;
            background-color: #0f172a;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        h1 { color: #fff; font-size: 1.5rem; }
        .user-info { color: #94a3b8; font-size: 0.9rem; }

        /* GRID DE PRODUCTOS */
        .catalog-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* Responsivo automático */
            gap: 20px;
            padding-bottom: 80px; /* Espacio para que el carrito no tape el final */
        }

        /* TARJETA DE PRODUCTO */
        .product-card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #34d399;
        }

        .icon-placeholder {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .prod-name { color: #fff; font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
        .prod-cat { 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .cat-basico { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .cat-nicho { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .prod-price { color: #fff; font-size: 1.5rem; font-weight: 300; margin-bottom: 15px; }

        .btn-add {
            background: #34d399;
            color: #064e3b;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-add:hover { background: #10b981; }

        /* CARRITO FLOTANTE */
        .cart-summary {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
        }
        
        .cart-count { background: #064e3b; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }

        /* --- RESPONSIVE CLIENTE (MÓVIL) --- */
        @media screen and (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            /* Carrito centrado abajo en el celular */
            .cart-summary {
                bottom: 20px;
                right: 50%;
                transform: translateX(50%); 
                width: 90%; 
                justify-content: center;
                font-size: 0.9rem;
            }

            /* Grid de 2 columnas apretadas en móvil */
            .catalog-container {
                grid-template-columns: 1fr 1fr; 
                gap: 10px;
            }
            
            .product-card { padding: 15px; }
            .icon-placeholder { font-size: 2rem; }
            .prod-name { font-size: 0.9rem; }
            .prod-price { font-size: 1.2rem; }
        }
        /* --- OVERLAY DE TIENDA CERRADA --- */
        #mensajeCerrado {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); /* Fondo oscuro casi sólido */
            z-index: 9999; /* Por encima de todo */
            display: none; /* Oculto por defecto */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        #mensajeCerrado h1 {
            font-size: 3rem;
            color: #ef4444; /* Rojo alerta */
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        #mensajeCerrado p {
            color: #fff;
            font-size: 1.2rem;
            max-width: 80%;
        }

        .reloj-icono { font-size: 5rem; margin-bottom: 20px; }
        /* Botón para regresar en el overlay */
        .btn-volver {
            margin-top: 25px;
            padding: 12px 25px;
            background: transparent;
            border: 2px solid #ef4444; /* Borde rojo a juego */
            color: #ef4444;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-volver:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🛒 Catálogo Andima</h1>
            <p class="user-info">Bienvenido, Cliente</p>
        </div>
        <a href="/" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: 500; border: 1px solid rgba(239, 68, 68, 0.3);">
    Cerrar Sesión
</a>
    </div>

    <div class="catalog-container" id="catalogo">
        <p style="color: white;">Cargando productos...</p>
    </div>

    <div class="cart-summary">
        <span>Total: $<span id="totalMonto">0.00</span></span>
        <span class="cart-count" id="totalItems">0</span>
    </div>

    <script>
        let carrito = []; 
        let total = 0;
        const usuarioActual = "Comprador1"; 

        async function cargarCatalogo() {
            try {
                const response = await fetch('/api/productos');
                const productos = await response.json();
                const contenedor = document.getElementById('catalogo');
                contenedor.innerHTML = '';

                if (productos.length === 0) {
                    contenedor.innerHTML = '<p style="color: white;">No hay productos.</p>';
                    return;
                }

                productos.forEach(prod => {
                    const icono = prod.categoria === 'nicho' ? '⭐' : '📦';
                    const claseCat = prod.categoria === 'nicho' ? 'cat-nicho' : 'cat-basico';
                    
                    const sinStock = prod.stock <= 0;
                    const btnTexto = sinStock ? 'Agotado' : 'Agregar';
                    const clickAction = sinStock ? '' : `agregarAlCarrito('${prod.nombre}', ${prod.precio})`;

                    contenedor.innerHTML += `
                        <div class="product-card">
                            <div class="icon-placeholder">${icono}</div>
                            <h3 class="prod-name">${prod.nombre}</h3>
                            <span class="prod-cat ${claseCat}">${prod.categoria}</span>
                            <div class="prod-price">$${prod.precio}</div>
                            <button class="btn-add" ${sinStock ? 'disabled style="background:#475569"' : ''} 
                                onclick="${clickAction}">
                                ${btnTexto}
                            </button>
                        </div>
                    `;
                });
            } catch (error) { console.error(error); }
        }

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio }); 
            total += precio;
            
            document.getElementById('totalItems').innerText = carrito.length;
            document.getElementById('totalMonto').innerText = total.toFixed(2);
            
            // Feedback visual sutil (opcional)
            console.log("Agregado: " + nombre);
        }

        document.querySelector('.cart-summary').addEventListener('click', async () => {
            if (carrito.length === 0) {
                alert("El carrito está vacío");
                return;
            }

            const direccion = prompt("📍 Por favor, ingresa tu dirección de entrega:");
            
            if (direccion) {
                const pedido = {
                    cliente: usuarioActual,
                    productos: carrito,
                    total: total,
                    direccion: direccion
                };

                const response = await fetch('/api/pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                });

                const data = await response.json();

                if (data.success) {
                    alert(`🎉 ¡Pedido Exitoso!\nTu Ticket: ${data.ticket}\nEl repartidor va en camino.`);
                    carrito = [];
                    total = 0;
                    document.getElementById('totalItems').innerText = "0";
                    document.getElementById('totalMonto').innerText = "0.00";
                    cargarCatalogo(); 
                } else {
                    alert("Error: " + data.message);
                }
            }
        });

        cargarCatalogo();
    </script>
    <div id="mensajeCerrado">
        <div class="reloj-icono">🌙</div>
        <h1>Tienda Cerrada</h1>
        <p>Nuestro horario de atención es de 07:00 a 21:00.</p>
        <p>Por favor, regresa mañana para realizar tu pedido.</p>
        
        <a href="/" class="btn-volver">⬅ Volver al Login</a>
    </div>

    <script>
        // Script auto-ejecutable para verificar la hora al cargar la página
        (function verificarHorario() {
            const ahora = new Date();
            const hora = ahora.getHours();

            // Si es antes de las 7 (0-6) o después de las 21 (21-23)
            if (hora < 7 || hora >= 21) {
                // 1. Mostramos el cartel de cerrado
                const cartel = document.getElementById('mensajeCerrado');
                cartel.style.display = 'flex';
                
                // 2. Opcional: Desactivamos el botón del carrito para asegurar
                document.querySelector('.cart-summary').style.display = 'none';
            }
        })();
    </script>
</body>
</html>
