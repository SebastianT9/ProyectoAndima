<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andima | Gestión de Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* --- ESTILOS ESPECÍFICOS DEL DASHBOARD --- */
        
        body {
            display: block !important; 
            height: auto !important;
            overflow-y: auto !important; 
            padding: 20px;
            background-color: #0f172a;
        }

        form {
            position: static !important;
            transform: none !important;
            width: 100% !important;
            height: auto !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        /* Contenedor principal (Grid) */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr; /* PC: Izquierda fijo, Derecha flexible */
            gap: 25px;
            align-items: start;
        }

        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { color: white; margin-bottom: 5px; }
        h2 { margin-bottom: 20px; color: #34d399; font-size: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        label { color: #94a3b8; font-size: 0.85rem; margin-top: 15px; margin-bottom: 5px; display: block; }
        
        input, select {
            width: 100%;
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            color: white !important;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        
        input:focus, select:focus {
            border-color: #34d399 !important;
            box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2);
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9rem; }
        th { text-align: left; padding: 12px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid #334155; }
        td { padding: 12px; border-bottom: 1px solid #334155; color: #e2e8f0; }
        tr:last-child td { border-bottom: none; }
        
        button {
            margin-top: 25px;
            background: #34d399;
            color: #064e3b;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
        button:hover { background: #10b981; }

        .header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn-logout {
            background-color: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* --- AQUÍ ESTÁ LA MAGIA PARA EL MÓVIL (RESPONSIVE) --- */
        @media screen and (max-width: 850px) {
            /* 1. Cambiamos a una sola columna */
            .dashboard-container {
                grid-template-columns: 1fr; 
            }

            /* 2. Permitimos scroll en la tabla si es muy ancha */
            .card {
                overflow-x: auto; 
            }
            
            /* 3. Ajustamos el encabezado */
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel de Encargado</h1>
        <a href="/" class="btn-logout">Cerrar Sesión</a>
    </div>

    <div class="dashboard-container">
        
        <div class="card">
            <h2>📦 Ingresar Producto</h2>
            <form id="productForm">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="Ej: Arroz Flor" required>

                <label>Precio de Venta ($)</label>
                <input type="number" id="precio" step="0.01" placeholder="0.00" required>

                <label>Stock Inicial</label>
                <input type="number" id="stock" placeholder="0" required>

                <label>Categoría</label>
                <select id="categoria">
                    <option value="basico">Canasta Básica</option>
                    <option value="nicho">Producto Nicho</option>
                </select>

                <button type="submit">Guardar en Inventario</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 Inventario Actual</h2>
            <table>
                <thead>
                    <tr>
                        <th>Cód</th>
                        <th>Producto</th>
                        <th>Cat.</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Cargar productos
        async function cargarProductos() {
            try {
                const response = await fetch('/api/productos');
                const productos = await response.json();
                
                const tabla = document.getElementById('tablaProductos');
                tabla.innerHTML = ''; 

                productos.forEach(prod => {
                    const alertaStock = prod.stock < 5 ? 'color: #ef4444; font-weight:bold;' : 'color: white;';
                    
                    const fila = `
                        <tr>
                            <td style="color: #94a3b8; font-size: 0.8rem;">${prod.codigo}</td>
                            <td>${prod.nombre}</td>
                            <td>${prod.categoria === 'nicho' ? '⭐' : '📦'}</td>
                            <td>$${prod.precio}</td>
                            <td style="${alertaStock}">${prod.stock}</td>
                            <td>
                                <button onclick="reabastecer('${prod.codigo}')" 
                                        style="background: #3b82f6; padding: 5px 10px; font-size: 12px; width: auto; margin: 0; color: white;">
                                    ➕
                                </button>
                            </td>
                        </tr>
                    `;
                    tabla.innerHTML += fila;
                });
            } catch (e) { console.error(e); }
        }

        // Reabastecer Stock
        async function reabastecer(codigo) {
            const cantidad = prompt(`Cant. a sumar para ${codigo}:`);
            if (cantidad && Number(cantidad) > 0) {
                const response = await fetch('/api/productos/stock', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo, cantidad })
                });
                if ((await response.json()).success) {
                    alert("✅ Stock actualizado");
                    cargarProductos();
                }
            }
        }

        // Guardar nuevo producto
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevoProducto = {
                nombre: document.getElementById('nombre').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value,
                categoria: document.getElementById('categoria').value
            };

            const response = await fetch('/api/productos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoProducto)
            });

            if ((await response.json()).success) {
                alert("✅ Producto guardado");
                document.getElementById('productForm').reset();
                cargarProductos();
            }
        });

        cargarProductos();
    </script>
</body>
</html>
