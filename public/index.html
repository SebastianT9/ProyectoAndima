<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andima | Acceso al Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <form id="loginForm">
        <div class="brand">
            <h1>ANDIMA</h1>
            <p>Tu tienda de confianza</p>
        </div>

        <label for="username">Usuario</label>
        <input type="text" placeholder="Ej: admin" id="username" autocomplete="off">

        <label for="password">Contraseña</label>
        <input type="password" placeholder="Ingresa tu clave" id="password">

        <button type="submit">Ingresar</button>
        
        <div class="footer-text">
            <p>Sistema de Gestión de Inventario y Ventas</p>
        </div>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Validación rápida visual
            if(!username || !password) {
                alert("Por favor completa todos los campos");
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.role === 'encargado') {
                        window.location.href = '/encargado.html';
                    } else if (data.role === 'cliente') {
                        window.location.href = '/cliente.html';
                    } else if (data.role === 'repartidor') {
                        window.location.href = '/repartidor.html'; // Preparamos el terreno para el repartidor
                    }
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión con el servidor");
            }
        });
    </script>
</body>
</html>
